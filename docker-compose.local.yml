volumes:
  palpal_local_postgres_data: {}
  palpal_local_postgres_data_backups: {}
  palpal_local_redis_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
      args:
        - INSTALL_CHROME=${INSTALL_CHROME:-false}
    image: palpal_local_django
    container_name: palpal_local_django
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    # Docker Desktop's embedded DNS forwarder is flaky for some domains
    # (tiktok.com, api.tikhub.io intermittently fail to resolve with
    # "[Errno -5] No address associated with hostname"). Pin public resolvers.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - '8011:8000'
      - '587:587'

    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: palpal_production_postgres
    ports:
      - '5435:5432'
    container_name: palpal_local_postgres
    volumes:
      - palpal_local_postgres_data:/var/lib/postgresql/data
      - palpal_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres

  redis:
    image: docker.io/redis:6
    container_name: palpal_local_redis

    volumes:
      - palpal_local_redis_data:/data


  celeryworker:
    <<: *django
    image: palpal_local_celeryworker
    container_name: palpal_local_celeryworker
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: palpal_local_celerybeat
    container_name: palpal_local_celerybeat
    depends_on:
      - redis
      - postgres
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: palpal_local_flower
    container_name: palpal_local_flower
    ports:
      - '5555:5555'
    command: /start-flower
