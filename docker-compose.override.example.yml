# Docker Compose override for bare metal Nginx setup
# This file provides an alternative volume mounting strategy
# Use this if you prefer to copy files instead of bind mounting

version: '3'

services:
  django:
    volumes:
      - production_django_media:/app/palpal/media
      # Comment out the bind mount below if /var/www/palpal/media doesn't exist
      # - /var/www/palpal/media:/app/palpal/media
