volumes:
  production_postgres_data: {}
  production_postgres_data_backups: {}
  production_django_media: {}
  production_redis_data: {}



services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
      args:
        - INSTALL_CHROME=${INSTALL_CHROME:-true}

    image: palpal_production_django
    volumes:
      - production_django_media:/app/palpal/media
      - /var/www/palpal/media:/app/palpal/media
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    command: /start
    ports:
      - '127.0.0.1:8001:5000'

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: palpal_production_postgres
    ports:
      - '5432:5432'
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
      - production_postgres_data_backups:/backups
    env_file:
      - ./.envs/.production/.postgres

  redis:
    image: docker.io/redis:6
    volumes:
      - production_redis_data:/data


  celeryworker:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
      args:
        - INSTALL_CHROME=${INSTALL_CHROME:-true}
    image: palpal_production_celeryworker
    volumes:
      - production_django_media:/app/palpal/media
      - /var/www/palpal/media:/app/palpal/media
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    environment:
      - HOME=/home/django
      - XDG_CACHE_HOME=/home/django/.cache
      - CHROME_BIN=/usr/bin/google-chrome-stable
      - DISPLAY=:99
    tmpfs:
      - /tmp/chrome-user-data:exec
      - /tmp/chrome-cache:exec
      - /tmp/downloads:exec
    shm_size: 2gb
    command: /start-celeryworker

  celerybeat:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
      args:
        - INSTALL_CHROME=${INSTALL_CHROME:-true}
    image: palpal_production_celerybeat
    volumes:
      - production_django_media:/app/palpal/media
      - /var/www/palpal/media:/app/palpal/media
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    command: /start-celerybeat

  flower:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
      args:
        - INSTALL_CHROME=${INSTALL_CHROME:-true}
    image: palpal_production_flower
    volumes:
      - production_django_media:/app/palpal/media
      - /var/www/palpal/media:/app/palpal/media
    depends_on:
      - postgres
      - redis
    env_file:
      - ./.envs/.production/.django
      - ./.envs/.production/.postgres
    command: /start-flower
    ports:
      - '127.0.0.1:5556:5555'
