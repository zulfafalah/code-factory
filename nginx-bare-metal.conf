# Nginx configuration for bare metal installation
# Copy this file to /etc/nginx/sites-available/palpal
# Then create symlink: sudo ln -s /etc/nginx/sites-available/palpal /etc/nginx/sites-enabled/
# Make sure to create media directory: sudo mkdir -p /var/www/palpal/media

# Main server block for Django application
server {
    listen 80;
    server_name 159.223.48.89;
    client_max_body_size 100M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Django media files (served from Docker volume mount)
    location /media/ {
        alias /var/www/palpal/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Django static files (if needed)
    location /static/ {
        alias /var/www/palpal/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy all other requests to Django (running in Docker on localhost:8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Handle large uploads
        client_max_body_size 100M;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Flower monitoring interface
server {
    listen 5555;
    server_name 159.223.48.89;

    location / {
        proxy_pass http://127.0.0.1:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
